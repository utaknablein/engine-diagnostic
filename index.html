<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GOVERN Diagnostic</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="wrap header-row">
      <div>
        <p class="eyebrow">GOVERN</p>
        <h1 data-i18n="title"></h1>
      </div>
      <button id="lang" class="ghost" aria-label="Switch language"></button>
    </div>
  </header>

  <main class="wrap">
    <p class="intro" data-i18n="intro"></p>
    <form id="form"></form>
    <div class="actions">
      <button id="score" type="button" data-i18n="score"></button>
    </div>
    <section id="result" hidden></section>
  </main>

  <footer class="wrap">
    <p data-i18n="footer"></p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
